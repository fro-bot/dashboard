---
# Signal an owner review of the same-repository release/pending PR. The controller reads live
# review state before authorizing a release.
name: Held Release Review

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  signal:
    name: Signal a review change
    if: >-
      github.event.pull_request.head.ref == 'release/pending' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.review.user.id == 831617 &&
      github.actor_id == '831617'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: 🔔 Signal
        run: echo "Review state changed; Held Release re-reads it."
