---
name: Release Pending Review

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  signal:
    if: >-
      github.actor_id == '831617' &&
      github.event.review.user.id == 831617 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/pending' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo 'Review signal only; the trusted workflow rechecks authority.'
