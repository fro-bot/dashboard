# Continuous Integration jobs for changes headed to main.
---
name: Main

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - env:
          TIMING: 1
        name: 💅🏽 Lint
        run: bun run lint

  design-check:
    name: Design Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🎨 Detect UI anti-patterns
        run: |
          # Pinned: an older major ignores .impeccable/config.json ignoreValues and would fail the gate on intentional brand tokens.
          # Exit 2 means findings; 1 means a target could not be scanned. Some versions exit 0 on a missing path, hence the path check.
          # stdout is a JSON array. Primary entries have no `advisory: true`; advisories are printed and never block.
          for target in web/src web/privacy.html; do
            if [ ! -e "$target" ]; then
              echo "::error::Design Check target '$target' does not exist. Update the scanned paths in this step."
              exit 1
            fi
          done

          work=$(mktemp -d)
          rc=0
          findings=$(npx impeccable@3.6.1 detect --json web/src web/privacy.html 2>"$work/stderr") || rc=$?

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::Impeccable could not scan (exit $rc)."
            cat "$work/stderr"
            exit 1
          fi

          # Split the array into primary and advisory entries; print "<primary> <advisory>" counts.
          if ! counts=$(printf '%s' "$findings" | node -e '
            const fs = require("node:fs");
            let data;
            try {
              data = JSON.parse(fs.readFileSync(0, "utf8"));
            } catch {
              process.exit(3);
            }
            if (!Array.isArray(data)) process.exit(3);
            const primary = data.filter((entry) => entry?.advisory !== true);
            const advisory = data.filter((entry) => entry?.advisory === true);
            const dir = process.argv[1];
            fs.writeFileSync(dir + "/primary.json", JSON.stringify(primary, null, 2));
            fs.writeFileSync(dir + "/advisory.json", JSON.stringify(advisory, null, 2));
            process.stdout.write(primary.length + " " + advisory.length);
          ' "$work"); then
            echo "::error::Impeccable could not scan: stdout is not a JSON array (exit $rc)."
            echo "$findings"
            cat "$work/stderr"
            exit 1
          fi
          primary_count=${counts% *}
          advisory_count=${counts#* }

          if [ "$primary_count" -gt 0 ]; then
            cat "$work/primary.json"
            echo
            echo "Impeccable detected UI anti-patterns. Address them or, for an intentional brand choice, add a scoped ignore via 'impeccable ignores add-value'."
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error::Impeccable exited 2 but reported no primary findings; treating the output as inconsistent."
            echo "$findings"
            exit 1
          fi
          if [ "$advisory_count" -gt 0 ]; then
            echo "::notice::Impeccable reported $advisory_count advisory finding(s); advisories do not block."
            cat "$work/advisory.json"
            echo
            echo "No blocking UI anti-patterns detected."
            exit 0
          fi
          echo "No UI anti-patterns detected."

  check-types:
    name: Check Types
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: ✅ Validate Types
        run: bun run check-types

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🏗 Build web
        run: bun run build:web

      - name: 💾 Restore Impeccable engine cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.impeccable/bin
          key: impeccable-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.agents/skills/impeccable/scripts/VERSION') }}

      - name: 🧪 Run Tests
        run: bun run test

  check-workflows:
    name: Check Workflows
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 🛠 Lint Workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  test-scripts-load:
    name: Test Scripts Load
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🧪 Load production scripts under Node strip-only
        # Node 24's strip-only TypeScript execution only erases type annotations -- it does
        # not transform TS-specific class constructs (parameter properties, enum, namespace).
        # Neither `tsc --noEmit` nor Vitest exercise the strip-only parser, so those runtime
        # errors used to surface only at runtime. Importing each production module here catches
        # them at merge time instead. Recursive over src/ so nested modules (routes/, github/,
        # auth/) are covered as the app grows, excluding tests.
        run: |
          while IFS= read -r f; do
            node -e "import('./$f').then(() => {}).catch(err => { process.stderr.write('FAIL $f: ' + (err.code || err.message) + '\\n'); process.exit(1); })"
            echo "  ok   $f"
          done < <(find src -name '*.ts' ! -name '*.test.ts' | sort)
